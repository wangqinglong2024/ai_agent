# ==============================================================================
# Ideas.top C端应用 - 生产环境 Docker Compose
# 用于腾讯云服务器部署，需加入 gateway_net 网络
# ==============================================================================

services:
  # --------------------------------------------------------------------------
  # FastAPI 后端
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ideas-backend
    restart: always
    env_file:
      - ./backend/.env
    # 让容器能访问宿主机 (Dify / Openclaw 等宿主机服务)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    networks:
      - gateway_net
      - global-data-link      # Supabase 内部通信
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --------------------------------------------------------------------------
  # React 前端 (Nginx 托管静态文件)
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ideas-frontend
    restart: always
    expose:
      - "80"
    networks:
      - gateway_net
      - global-data-link
    depends_on:
      - backend

# ==============================================================================
# 网络
# ==============================================================================
networks:
  gateway_net:
    external: true
  global-data-link:
    external: true
