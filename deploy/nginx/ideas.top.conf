# ==============================================================================
# 自建主站路由配置 (带 SSL 证书)
# 域名: ideas.top
# ==============================================================================

# ------------------------------------------------------------------------------
# 0. 定义上游服务 (Upstreams)
# ------------------------------------------------------------------------------
upstream custom_backend {
    server ideas-backend:8080;
}

upstream custom_frontend {
    server ideas-frontend:80;
}

# ------------------------------------------------------------------------------
# 1. HTTP 重定向服务 (Port 80)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name ideas.top www.ideas.top;

    # 301 永久重定向到 HTTPS
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------
# 2. HTTPS 主服务 (Port 443)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name ideas.top www.ideas.top;

    # ==========================================================================
    # SSL 证书配置
    # ==========================================================================
    ssl_certificate     /etc/nginx/cert/ideas.top_bundle.crt;
    ssl_certificate_key /etc/nginx/cert/ideas.top.key;

    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    # ==========================================================================
    # 路由转发规则
    # ==========================================================================

    # 1. 后端 API 转发 (/api/ → 后端根路径)
    #    注意: proxy_pass 末尾带 / 会把 /api/ 前缀去掉
    #    例: /api/chat/send → 后端收到 /chat/send
    location /api/ {
        proxy_pass http://custom_backend/;

        # 基础代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应关键配置
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 超时设置 (AI 生成可能需要较长时间)
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 2. 前端页面转发 (兜底规则)
    location / {
        proxy_pass http://custom_frontend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持 (Vite HMR / React 热更新)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 3. 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
