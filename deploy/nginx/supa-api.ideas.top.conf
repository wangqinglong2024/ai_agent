# Supabase Kong API 网关
# 将此文件复制到服务器: /opt/gateway/conf.d/supa-api.ideas.top.conf
# 然后重启 gateway: docker restart global-gateway
#
# 注意: 如果 Kong 容器名不是 supabase-kong，请先查:
#   docker ps | grep kong
# 然后替换下面的 supabase-kong 为实际容器名

server {
    listen 80;
    server_name supa-api.ideas.top;

    # Supabase Kong API 网关需要较大的请求体 (文件上传等)
    client_max_body_size 50M;

    location / {
        proxy_pass http://supabase-kong:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持 (Supabase Realtime)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
